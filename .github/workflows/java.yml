name: Java CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Welcome.java
        run: javac Welcome.java

      - name: Run Welcome
        run: java Welcome
